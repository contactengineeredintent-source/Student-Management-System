<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body style="background-color: #cdcdcd">
    <header class="d-flex align-items-center text-white p-3">
      <p class="m-0">Student Portal</p>
    </header>
    <main>
      <div
        id="searchBar"
        class="d-flex mt-3 ms-3 me-3 gap-2 align-items-center"
      >
        <form id="form" class="w-100">
          <div>
            <input
              type="text"
              class="form-control"
              id="search"
              placeholder="Search"
            />
          </div>
        </form>
        <button id="btnSearch" class="btn btn-dark rounded-0">Search</button>
      </div>
      <div
        id="sortingSection"
        class="d-flex mt-3 ms-3 me-3 gap-2 align-items-center justify-content-between"
      >
        <button id="sortA2Z" class="btn btn-dark rounded-0 flex-fill">
          Sort A->Z
        </button>
        <button id="sortZ2A" class="btn btn-dark rounded-0 flex-fill">
          Sort Z->A
        </button>
        <button id="sortByMarks" class="btn btn-dark rounded-0 flex-fill">
          Sort By Marks
        </button>
        <button id="sortByPassing" class="btn btn-dark rounded-0 flex-fill">
          Sort By Passing
        </button>
        <button id="sortByClass" class="btn btn-dark rounded-0 flex-fill">
          Sort By Class
        </button>
        <button id="sortByGender" class="btn btn-dark rounded-0 flex-fill">
          Sort By Gender
        </button>
      </div>

      <!-- General Table -->
      <div class="mx-3 general_table_section">
        <table class="table table-bordered mt-3">
          <thead>
            <tr>
              <th class="fs-5">ID</th>
              <th class="fs-5">Name</th>
              <th class="fs-5">Gender</th>
              <th class="fs-5">Class</th>
              <th class="fs-5">Marks</th>
              <th class="fs-5">Passing</th>
              <th class="fs-5">Email</th>
            </tr>
          </thead>
          <tbody class="general_table_body"></tbody>
        </table>
      </div>

      <!-- Males Table -->
      <div class="mx-3 males_table_section">
        <table class="table table-bordered mt-3">
          <thead>
            <tr>
              <th class="fs-5">ID</th>
              <th class="fs-5">Name</th>
              <th class="fs-5">Gender</th>
              <th class="fs-5">Class</th>
              <th class="fs-5">Marks</th>
              <th class="fs-5">Passing</th>
              <th class="fs-5">Email</th>
            </tr>
          </thead>
          <tbody class="males_table_body"></tbody>
        </table>
      </div>

      <!-- Females Table -->
      <div class="mx-3 females_table_section">
        <table class="table table-bordered mt-3">
          <thead>
            <tr>
              <th class="fs-5">ID</th>
              <th class="fs-5">Name</th>
              <th class="fs-5">Gender</th>
              <th class="fs-5">Class</th>
              <th class="fs-5">Marks</th>
              <th class="fs-5">Passing</th>
              <th class="fs-5">Email</th>
            </tr>
          </thead>
          <tbody class="females_table_body"></tbody>
        </table>
      </div>
    </main>
  </body>
  <script src="script.js"></script>
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"
  ></script>
</html>
